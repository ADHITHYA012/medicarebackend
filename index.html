<script>
    const API_BASE = 'https://medicarebackend-1nvu.onrender.com';
    let currentUserEmail = localStorage.getItem('medicareUser') || '';

    document.getElementById('bookingDate').valueAsDate = new Date();

    // Page Load check if already logged in
    window.onload = function() {
        if (currentUserEmail) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('welcomeUser').innerText = `Welcome, ${currentUserEmail}!`;
            fetchLiveQueue();
        }
    };

    function showAlert(msg, isSuccess = false) {
        const alertBox = document.getElementById('alertMsg');
        alertBox.innerText = msg;
        alertBox.className = `alert-msg ${isSuccess ? 'alert-success' : 'alert-error'}`;
        alertBox.style.display = 'block';
    }

    function toggleAuth(showRegister) {
        document.getElementById('alertMsg').style.display = 'none';
        document.getElementById('loginForm').style.display = showRegister ? 'none' : 'block';
        document.getElementById('registerForm').style.display = showRegister ? 'block' : 'none';
    }

    async function handleRegister() {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        if (!email || !password) return showAlert("Please fill all fields!");

        try {
            const res = await fetch(`${API_BASE}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success) {
                showAlert("Registration Successful! Please login.", true);
                setTimeout(() => toggleAuth(false), 1500);
            } else {
                showAlert(data.message || "Registration failed.");
            }
        } catch (err) { showAlert("Server error."); }
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) return showAlert("Please fill all fields!");

        try {
            const res = await fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.success) {
                currentUserEmail = data.email;
                localStorage.setItem('medicareUser', currentUserEmail); // Save session
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('welcomeUser').innerText = `Welcome, ${currentUserEmail}!`;
                fetchLiveQueue();
            } else {
                showAlert(data.message || "Invalid Email or Password.");
            }
        } catch (err) { showAlert("Server error during login."); }
    }

    function handleLogout() {
        currentUserEmail = '';
        localStorage.removeItem('medicareUser'); // Clear session
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
    }

    function selectDoctor(doctorName) {
        document.getElementById('selectedDoctor').value = doctorName;
        fetchLiveQueue();
    }

    async function confirmBooking() {
        // Fallback check from localStorage if empty
        if (!currentUserEmail) {
            currentUserEmail = localStorage.getItem('medicareUser');
        }

        if (!currentUserEmail) {
            alert("Please login first!");
            handleLogout();
            return;
        }

        const doctorName = document.getElementById('selectedDoctor').value;
        const date = document.getElementById('bookingDate').value;
        const timeSlot = document.getElementById('bookingTime').value;

        try {
            const res = await fetch(`${API_BASE}/api/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentUserEmail, doctorName, date, timeSlot })
            });
            const data = await res.json();

            if (data.success) {
                alert(`🎉 Booking Confirmed!\nYour Token Number: #${data.tokenNumber}`);
                document.getElementById('yourTokenNo').innerText = `#${data.tokenNumber}`;
                fetchLiveQueue();
            } else {
                alert(data.message || "Booking failed.");
            }
        } catch (err) {
            alert("Booking error!");
        }
    }

    async function fetchLiveQueue() {
        const doctorName = document.getElementById('selectedDoctor').value;
        const date = document.getElementById('bookingDate').value;

        try {
            const res = await fetch(`${API_BASE}/api/queue-status?doctorName=${encodeURIComponent(doctorName)}&date=${date}`);
            const data = await res.json();

            if (data.success) {
                document.getElementById('currentTokenNo').innerText = `#${data.currentToken}`;
                const userTokenStr = document.getElementById('yourTokenNo').innerText.replace('#', '');
                const userToken = parseInt(userTokenStr) || 0;

                if (userToken > 0) {
                    const waitDiff = userToken - data.currentToken;
                    const estTime = waitDiff > 0 ? waitDiff * 10 : 0;
                    document.getElementById('estWaitTime').innerText = `${estTime} mins`;
                }
            }
        } catch (err) { console.log("Queue error", err); }
    }
</script>
